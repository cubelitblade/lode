[project]
name = "lode"
version = "0.1.0"
description = "Lode is a local-first knowledge mining engine that turns your workspace into a searchable knowledge lode."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "blake3>=1.0.9",
    "httpx>=0.28.1",
    "pathspec>=0.11.0",
    "platformdirs>=4.2.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.2.0",
    "rich>=13.10.0",
    "sqlite-vec>=0.1.9",
    "tomlkit>=0.12.0",
    "typer>=0.27.1",
    "lode-simple-native-linux-x86_64>=0.7.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "lode-simple-native-linux-aarch64>=0.7.1; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "lode-simple-native-macos-arm64>=0.7.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "lode-simple-native-macos-x86_64>=0.7.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "lode-simple-native-win-amd64>=0.7.1; sys_platform == 'win32' and platform_machine == 'AMD64'",
    "lode-simple-native-win-arm64>=0.7.1; sys_platform == 'win32' and platform_machine == 'ARM64'",
]

[project.scripts]
lode = "lode.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lode"]

[dependency-groups]
dev = [
    "build>=1.6.0",
    "hatchling>=1.32",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
evals = [
    "datasets>=3.0.0",
    "huggingface_hub>=0.30.0",
    "pyarrow>=18.0.0",
    "pandas>=2.2.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "tests", "packages/*/src"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
lode-simple-native-linux-x86_64 = { workspace = true }
lode-simple-native-linux-aarch64 = { workspace = true }
lode-simple-native-macos-arm64 = { workspace = true }
lode-simple-native-macos-x86_64 = { workspace = true }
lode-simple-native-win-amd64 = { workspace = true }
lode-simple-native-win-arm64 = { workspace = true }
