[project]
name = "lode"
version = "0.1.0"
description = "lode: local knowledge base semantic search exposed over MCP"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "blake3>=1.0.9",
    "httpx>=0.28.1",
    "pathspec>=0.11.0",
    "platformdirs>=4.2.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.2.0",
    "rich>=13.10.0",
    "sqlite-vec>=0.1.9",
    "tomlkit>=0.12.0",
    "typer>=0.27.1",
]

[project.scripts]
lode = "lode.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lode"]

[dependency-groups]
dev = ["pyright>=1.1.411", "pytest>=9.1.1", "ruff>=0.16.3"]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "SIM"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
