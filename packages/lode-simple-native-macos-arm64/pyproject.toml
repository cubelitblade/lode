[project]
name = "lode-simple-native-macos-arm64"
version = "0.7.1"
description = "Native simple FTS5 tokenizer binary for macOS arm64"
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lode_simple_native"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
