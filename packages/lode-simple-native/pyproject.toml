[project]
name = "lode-simple-native"
version = "0.7.1"
description = "Native simple FTS5 tokenizer binary"
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lode_simple_native"]
only-include = [
    "src/lode_simple_native/__init__.py",
    "src/lode_simple_native/py.typed",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
