# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        enable-cache: auto

    - name: Set up Python environment (${{ matrix.python-version }})
      run: |
        uv python install ${{ matrix.python-version }}
        uv sync --python ${{ matrix.python-version }} --all-extras --dev

    - name: Lint with Ruff
      run: uv run --python ${{ matrix.python-version }} ruff check .

    - name: Lint with Pyright
      run: uv run --python ${{ matrix.python-version }} pyright

    - name: Test with PyTest
      run: uv run --python ${{ matrix.python-version }} pytest
