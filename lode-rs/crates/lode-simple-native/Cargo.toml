[package]
name = "lode-simple-native"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "lode FTS5 simple tokenizer (statically linked, pinyin and jieba)"

[lib]
crate-type = ["rlib"]

[dependencies]
libc = "0.2"
blake3 = "1"
rusqlite = { version = "0.32", features = ["bundled-full"] }
thiserror = "2"

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"
